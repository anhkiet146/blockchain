<!DOCTYPE html>
<html>
  <head>
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body
    class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen p-6 flex items-center justify-center"
  >
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
      <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Login</h1>
      <!-- Hiển thị thông báo về trạng thái ví -->
      {% with messages = get_flashed_messages() %} {% if messages %} {% for
      message in messages %}
      <div
        class="mb-4 p-2 text-sm {{ 'text-green-700 bg-green-100' if 'successful' in message or 'loaded' in message else 'text-red-700 bg-red-100' }} rounded"
      >
        {{ message }}
      </div>
      {% endfor %} {% endif %} {% endwith %}
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-blue-700"
            >Username</label
          >
          <input
            type="text"
            name="username"
            class="mt-1 block border-blue-300 w-full p-2 border rounded-md focus:ring focus:ring-blue-300"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-700"
            >Password</label
          >
          <input
            type="password"
            name="password"
            class="mt-1 block border-blue-300 w-full p-2 border rounded-md focus:ring focus:ring-blue-300"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700 transition"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
