<!DOCTYPE html>
<html>
  <head>
    <title>User List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header
      class="bg-white shadow p-4 flex justify-between items-center w-full z-10"
    >
      <h1 class="text-xl font-bold text-gray-800">Admin Dashboard</h1>
      <div>
        {% if session.get('user_id') %}
        <span class="mr-4 font-semibold"
          >Xin Chào, {{ session['username'] }}</span
        >
        <a
          href="{{ url_for('logout') }}"
          class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded"
          >Đăng Xuất</a
        >
        {% else %}
        <a
          href="{{ url_for('login') }}"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded"
          >Đăng Nhập</a
        >
        {% endif %}
      </div>
      <button
        id="sidebarToggleMobile"
        class="text-gray-600 focus:outline-none md:hidden"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </header>
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <div
        id="sidebar"
        class="sidebar bg-white shadow-lg h-screen fixed md:relative z-20 w-64"
      >
        <div class="p-4 flex items-center justify-between border-b">
          <h2 class="text-2xl font-semibold text-gray-800">Menu</h2>
          <button
            id="sidebarToggle"
            class="text-gray-600 focus:outline-none md:hidden"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
        <nav class="mt-6">
          <a
            href="{{ url_for('admin_dashboard') }}"
            class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200"
          >
            <span class="sidebar-text">Dashboard</span>
          </a>
          <a
            href="{{ url_for('admin_users') }}"
            class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200"
          >
            <span class="sidebar-text">View Users</span>
          </a>
          <a
            href="{{ url_for('view_chain') }}"
            class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200"
          >
            <span class="sidebar-text">View Blockchain</span>
          </a>
          <a
            href="{{ url_for('admin_notifications') }}"
            class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200"
          >
            <span class="sidebar-text">Notifications</span>
          </a>
        </nav>
      </div>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col">
        <main class="overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
          <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">User List</h1>

            <div class="bg-white rounded-lg shadow overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-blue-500 text-white">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                    >
                      Username
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                    >
                      Role
                    </th>
                  </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                  {% for user in users %}
                  <tr class="hover:bg-blue-50">
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                    >
                      {{ user.username }}
                    </td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-600"
                    >
                      {{ user.role }}
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Sidebar Toggle JS -->
    <script>
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const sidebarToggleMobile = document.getElementById(
        "sidebarToggleMobile"
      );

      const toggleSidebar = () => {
        sidebar.classList.toggle("hidden");
      };

      if (sidebarToggle) sidebarToggle.addEventListener("click", toggleSidebar);
      if (sidebarToggleMobile)
        sidebarToggleMobile.addEventListener("click", toggleSidebar);
    </script>
  </body>
</html>
